<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="تسجيل الدخول إلى متجر أم فؤاد">
  <title>تسجيل الدخول - متجر أم فؤاد</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <div class="logo"><a href="index.html" class="logo-link">أم فؤاد</a></div>
    <nav>
      <a href="index.html">الرئيسية</a>
      <a href="index.html#products">منتجاتنا</a>
      <a href="index.html#contact">تواصل معنا</a>
    </nav>
  </header>

  <section class="auth-section">
    <div class="auth-card">
      <h2>تسجيل الدخول</h2>
      <p class="auth-sub">سجّل دخولك لمتابعة طلباتك في متجر أم فؤاد</p>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="emailInput">البريد الإلكتروني</label>
          <input type="email" id="emailInput" value="" placeholder="example@email.com" autocomplete="email" required>
          <span class="error" id="emailError"></span>
        </div>

        <div class="field">
          <label for="passwordInput">كلمة المرور</label>
          <div class="password-wrap">
            <input type="password" id="passwordInput" value="" placeholder="••••••••" autocomplete="current-password" required minlength="6">
            <button type="button" class="toggle-pass" id="togglePass" aria-label="إظهار كلمة المرور">👁</button>
          </div>
          <span class="error" id="passwordError"></span>
        </div>

        <button type="submit" id="loginSubmit">
          <span class="btn-label">دخول</span>
          <span class="spinner" id="loginSpinner" hidden></span>
        </button>

       
      </form>
    </div>
  </section>

  <footer>
    <p>© 2026 جميع الحقوق محفوظة - متجر أم فؤاد</p>
  </footer>

  <div class="toast-container" id="toastContainer"></div>

  <script src="js/session.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
